name: case3

x-server-environment: &server-environment
  APP_ENV: ${APP_ENV:-local}
  POSTGRES_DB: ${POSTGRES_DB:-case3}
  POSTGRES_USER: ${POSTGRES_USER:-case3}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: "5432"
  SESSION_HOURS: ${SESSION_HOURS:-8}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8000","http://127.0.0.1:8000"]}
  BLOB_BACKEND: postgres
  OFFICE_CONVERTER: ${OFFICE_CONVERTER:-disabled}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-local}
  LOCAL_BASE_URL: http://ollama:11434
  LOCAL_MODEL: ${LOCAL_MODEL:-qwen3-vl:2b-instruct}
  LOCAL_TIMEOUT_SECONDS: ${LOCAL_TIMEOUT_SECONDS:-300}
  LOCAL_CONTEXT_WINDOW_SIZE: ${LOCAL_CONTEXT_WINDOW_SIZE:-16384}
  LOCAL_MAX_OUTPUT_TOKENS: ${LOCAL_MAX_OUTPUT_TOKENS:-2048}
  LOCAL_MAX_INPUT_BYTES: ${LOCAL_MAX_INPUT_BYTES:-12000000}
  LOCAL_MAX_RESPONSE_BYTES: ${LOCAL_MAX_RESPONSE_BYTES:-4000000}
  LOCAL_NUM_THREADS: ${LOCAL_NUM_THREADS:-6}
  LOCAL_KEEP_ALIVE_SECONDS: ${LOCAL_KEEP_ALIVE_SECONDS:-30}
  LOCAL_IMAGE_MAX_SIDE: ${LOCAL_IMAGE_MAX_SIDE:-1280}
  LOCAL_MODEL_DIGEST: ${LOCAL_MODEL_DIGEST:-}
  OLMOCR_BASE_URL: ${OLMOCR_BASE_URL:-https://ocr.ilons.ru}
  OLMOCR_API_TOKEN: ${OLMOCR_API_TOKEN:-}
  OLMOCR_TIMEOUT_SECONDS: ${OLMOCR_TIMEOUT_SECONDS:-300}
  OLMOCR_PROFILE_REVISION: ${OLMOCR_PROFILE_REVISION:-1}
  OLMOCR_MAX_INPUT_BYTES: ${OLMOCR_MAX_INPUT_BYTES:-50000000}
  OCR_PREPARATION_MAX_PAGES: ${OCR_PREPARATION_MAX_PAGES:-200}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://llm.ilons.ru}
  QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3.8-27B}
  QWEN_CONTEXT_WINDOW_SIZE: ${QWEN_CONTEXT_WINDOW_SIZE:-262000}
  ILONS_API_KEY: ${ILONS_API_KEY:-}
  QWEN_GENERATION_PATH: ${QWEN_GENERATION_PATH:-}
  QWEN_API_FORMAT: ${QWEN_API_FORMAT:-}
  QWEN_AUTH_HEADER: ${QWEN_AUTH_HEADER:-}
  QWEN_AUTH_SCHEME: ${QWEN_AUTH_SCHEME:-}
  # Empty optional Qwen fields stay unset in local mode; no undocumented timeout is guessed.
  QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-}
  QWEN_MAX_OUTPUT_TOKENS: ${QWEN_MAX_OUTPUT_TOKENS:-8192}
  QWEN_MAX_INPUT_BYTES: ${QWEN_MAX_INPUT_BYTES:-750000}
  QWEN_MAX_RESPONSE_BYTES: ${QWEN_MAX_RESPONSE_BYTES:-4000000}

x-backend: &backend
  image: case3-backend:inf01
  build:
    context: ./backend
  environment: *server-environment
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case3}
      POSTGRES_USER: ${POSTGRES_USER:-case3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No host port: PostgreSQL is reachable only within the Compose network.

  migrate:
    <<: *backend
    command: ["python", "-m", "app.runtime.cli", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    <<: *backend
    environment:
      <<: *server-environment
      BOOTSTRAP_SPECIALIST_USERNAME: ${BOOTSTRAP_SPECIALIST_USERNAME:-specialist}
      BOOTSTRAP_SPECIALIST_PASSWORD: ${BOOTSTRAP_SPECIALIST_PASSWORD:?Set specialist password in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set administrator password in .env}
    command: ["python", "-m", "app.runtime.cli", "bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.runtime.worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6
    profiles: [local]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: ${LOCAL_CONTEXT_WINDOW_SIZE:-16384}
      CUDA_VISIBLE_DEVICES: "-1"
      ROCR_VISIBLE_DEVICES: "-1"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No host port or automatic pull. The adapter checks a local manifest and always sets num_gpu=0.

volumes:
  postgres-data:
  ollama-data:
