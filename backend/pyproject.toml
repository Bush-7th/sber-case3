[project]
name = "sber-case3-backend"
version = "0.1.0"
description = "Case 3 HTTP contracts and backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pypdfium2>=5,<6",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: creates a disposable database using TEST_DATABASE_URL (CREATE DATABASE access)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
